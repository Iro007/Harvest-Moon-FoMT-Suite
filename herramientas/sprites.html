<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprites de NPC y retratos</title>
<style>
:root{
  --bg:#14171a; --panel:#1b1f23; --panel2:#22272c; --line:#2f353b;
  --ink:#e6e3dc; --mute:#8b9298; --acc:#5fc4b0; --acc2:#e0b45a; --bad:#e07a6a;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650}
header .sub{color:var(--mute);font-size:12px}
#romst{color:var(--mute);font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);color:#0c1613;border-color:var(--acc);font-weight:600}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
main{flex:1;display:grid;grid-template-columns:270px 1fr 320px;min-height:0}
.col{overflow:auto;min-height:0;background:var(--panel)}
.col.l{border-right:1px solid var(--line)} .col.r{border-left:1px solid var(--line)}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;cursor:pointer;color:var(--mute)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.search{padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:37px;background:var(--panel);z-index:2}
.search input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.search label{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 12px;cursor:pointer}
.item:hover{background:var(--panel2)} .item.on{background:var(--panel2);border-left-color:var(--acc)}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute);font-family:var(--mono);font-size:11px;white-space:nowrap}
.item .new{color:var(--acc2)}
.empty{padding:28px 18px;color:var(--mute)} .empty strong{color:var(--ink)}
#stage{overflow:auto;min-height:0;padding:16px 20px}
#stage h2{margin:0 0 2px;font-size:17px}
.meta{color:var(--mute);font-size:12px;font-family:var(--mono)}
.sw{display:inline-flex;vertical-align:middle;margin-left:8px}.sw i{width:12px;height:12px;border:1px solid var(--line);display:block}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}
.sets button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.sets button.on{border-color:var(--acc);color:var(--acc)}
.poses{display:flex;gap:14px;flex-wrap:wrap}
.pose{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.pose b{display:block;font-size:13px}.pose small{color:var(--mute);font-family:var(--mono);font-size:11px}
canvas.pl{image-rendering:pixelated;display:block;margin:6px auto;background:
  repeating-conic-gradient(#2b4a2e 0 25%,#27432a 0 50%) 0 0/16px 16px;border-radius:4px}
h3{font-size:12px;font-weight:600;color:var(--mute);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;min-width:0}
.cell small{display:block;color:var(--mute);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{padding:12px 14px;border-bottom:1px solid var(--line)}
.side h4{margin:0 0 6px;font-size:13px}
.side p{margin:4px 0;color:var(--mute);font-size:12px}
.side label{display:block;color:var(--mute);font-size:12px;margin:8px 0 3px}
.side select,.side input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.side input[type=file]{width:100%;font-size:12px}
.side .btn{margin-top:8px}
.msg{font-size:12px;margin-top:8px;white-space:pre-wrap}
.ok{color:var(--acc)} .bad{color:var(--bad)}
.log{font-size:12px;color:var(--mute);padding-left:18px;margin:6px 0}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .dh h3{margin:0;font-size:15px;flex:1;color:var(--ink);text-transform:none;letter-spacing:0}
dialog .db{overflow:auto;padding:10px 16px;max-height:60vh}
dialog .db li{margin:3px 0}
dialog .df{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
@media(max-width:1000px){main{grid-template-columns:200px 1fr}.col.r{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}main{grid-auto-rows:minmax(0,1fr) auto}}
</style>
</head>
<body>
<header>
  <div><h1>Sprites de NPC y retratos</h1><div class="sub">FoMT (GBA, USA) — animaciones en 4 poses y retratos leídos de la ROM real; importar PNG, NPC y retratos nuevos</div></div>
  <div style="flex:1"></div>
  <span id="romst">Sin ROM</span>
  <label class="btn" for="rom-in">Abrir ROM (.gba)</label>
  <input id="rom-in" type="file" accept=".gba" hidden>
  <button class="btn primary" id="genbtn" disabled>Generar ROM</button>
</header>
<main>
  <section class="col l" aria-label="Personajes">
    <div class="tabs" role="tablist"><button class="on" data-tab="spr">Sprites</button><button data-tab="por">Retratos</button></div>
    <div class="search"><input id="q" type="search" placeholder="Buscar personaje o anim (0x22F)…" aria-label="Buscar">
      <label><input type="checkbox" id="only4" checked> solo con 4 direcciones</label></div>
    <div id="list"><div class="empty"><strong>Abre la ROM</strong> (o cárgala en la suite) para ver los sprites y retratos.</div></div>
  </section>
  <section id="stage" aria-label="Vista"><div class="empty">Elige un personaje de la lista.</div></section>
  <section class="col r" id="side" aria-label="Acciones"></section>
</main>
<dialog id="gendlg">
  <div class="dh"><h3>Generar ROM</h3><button class="btn" id="genclose">Cerrar</button></div>
  <div class="db" id="genbody"></div>
  <div class="df" id="genfoot"></div>
</dialog>

  if (!nr) throw new Error("El personaje nuevo no aparece al releer el banco");
  if (img) imp = applySheet(KB[k], nr, img, mode);
  if (name) CUSTOM[k][c.a0] = name;
  LOG.push(`${BANKS[k].titulo}: «${name || "Nuevo"}» creado en ${hex(c.a0)}–${hex(c.a0 + c.n - 1)} desde «${run.nombre}»${img ? " con PNG" : ""}`);
  refresh(); snapshot();
  const fin = RUNS[k].find(r => r.a0 === c.a0);
  return {a0: c.a0, n: c.n, sets: fin ? fin.sets : [], imp};
}
function exportSheet(K, run, L){
  const c = document.createElement("canvas"); c.width = L.cols * L.W; c.height = L.rows.length * L.H; const cx = c.getContext("2d");
  L.rows.forEach((row, ri) => row.frames.forEach((f, ci) => { const fc = frameCanvas(K, f); if (fc.W) cx.drawImage(fc.c, ci * L.W + fc.x0 - L.x0, ri * L.H + fc.y0 - L.y0); }));
  c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${run.nombre.replace(/[^\w-]+/g, "_")}_${hex(run.a0)}_${L.W}x${L.H}.png`; a.click(); });
}

// ---------------------------------------------------------------- generar y verificar
function verify(rom){
  const out = [], bad = [];
  for (const k of ["spr", "por"]) {
    const B = BANKS[k]; let K;
    try { K = bankOf(rom, B); } catch (e) { bad.push(e.message); continue; }
    const want = Math.max(NCOUNT0[k], ...[...SNAP[k].keys()].map(a => a + 1));
    if (K.cnt[0] !== want) bad.push(`${B.titulo}: ${K.cnt[0]} animaciones al releer, se esperaban ${want}`);
    const hs = bankHashes(K); let same = 0, chg = 0, nw = 0;
    for (let a = 0; a < hs.length; a++) {
      const exp = SNAP[k].has(a) ? SNAP[k].get(a) : (a < H0[k].length ? H0[k][a] : null);
      if (exp === null || hs[a] !== exp) { bad.push(`${B.titulo}: la animación ${hex(a)} no se relee igual`); if (bad.length > 20) break; continue; }
      if (a >= NCOUNT0[k]) nw++; else if (SNAP[k].has(a)) chg++; else same++;
    }
    const moved = K.off !== bankOf(ORIG, B).off;
    out.push(`${B.titulo}: banco en ${hex(K.off + ROM_BASE, 8)}${moved ? " (reubicado, " + B.refs.length + " punteros actualizados)" : ""} · ${same} sin cambios idénticas a la ROM de partida · ${chg} modificadas · ${nw} nuevas — releídas desde los punteros del juego`);
  }
  for (let i = 0xA0; i < 0xC0; i++) if (rom[i] !== ORIG[i]) { bad.push("La cabecera de la ROM cambió"); break; }
  return {out, bad};
}
$("genbtn").onclick = () => {
  const dl = $("gendlg"), body = $("genbody"), foot = $("genfoot");
  const rom = WORK.slice(), v = verify(rom);
  body.innerHTML = `<p>${LOG.length ? `${LOG.length} cambios:` : "Sin cambios: la ROM saldrá igual."}</p>${LOG.length ? `<ul>${LOG.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <p><b>Verificación de relectura</b> (se vuelve a leer la ROM generada desde cero):</p><ul>${v.out.map(x => `<li class="ok">${esc(x)}</li>`).join("")}${v.bad.map(x => `<li class="bad">${esc(x)}</li>`).join("")}</ul>
    <p>${v.bad.length ? `<span class="bad">✗ La verificación falló: no se descarga.</span>` : `<span class="ok">✓ Verificación correcta.</span> ROM de ${(rom.length / 1048576).toFixed(rom.length % 1048576 ? 2 : 0)} MB${rom.length > ORIG.length ? " (ampliada: los emuladores la aceptan, un cartucho real quizá no)" : ""}.`}</p>`;
  foot.innerHTML = "";
  if (!v.bad.length) {
    const b = document.createElement("button"); b.className = "btn primary"; b.textContent = "Descargar ROM (.gba)";
    const name = ROMNAME.replace(/\.gba$/i, "") + " (sprites).gba";
    b.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rom])); a.download = name; a.click(); };
    foot.appendChild(b);
    if (FomtHub.inSuite) { FomtHub.publish(rom, name); const s = document.createElement("span"); s.className = "ok"; s.style.alignSelf = "center"; s.textContent = "Enviada a la suite como ROM de trabajo."; foot.prepend(s); }
  }
  dl.showModal();
};
$("genclose").onclick = () => $("gendlg").close();
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  MODE = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("only4").parentNode.style.display = MODE === "spr" ? "" : "none"; renderList(); renderStage(); renderSide();
});
$("q").oninput = renderList; $("only4").onchange = renderList;
$("rom-in").onchange = async e => { const f = e.target.files[0]; if (f) await loadRom(await f.arrayBuffer(), f.name); e.target.value = ""; };
FomtHub.onRom((b, name) => loadRom(b, name));
</script>

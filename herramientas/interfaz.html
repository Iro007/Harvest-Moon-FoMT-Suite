<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interfaz y menús</title>
<style>
:root{
  --bg:#14171a; --panel:#1b1f23; --panel2:#22272c; --line:#2f353b;
  --ink:#e6e3dc; --mute:#8b9298; --acc:#5fc4b0; --acc2:#e0b45a; --bad:#e07a6a;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650}
header .sub{color:var(--mute);font-size:12px}
#romst{color:var(--mute);font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);color:#0c1613;border-color:var(--acc);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
main{flex:1;display:grid;grid-template-columns:250px 1fr 300px;min-height:0}
.col{overflow:auto;min-height:0;background:var(--panel)}
.col.l{border-right:1px solid var(--line)} .col.r{border-left:1px solid var(--line)}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;cursor:pointer;color:var(--mute)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.grp{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:12px 12px 4px}
.item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 12px;cursor:pointer}
.item:hover{background:var(--panel2)} .item.on{background:var(--panel2);border-left-color:var(--acc)}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute);font-family:var(--mono);font-size:11px;white-space:nowrap}
.item .ed{color:var(--acc2)} .item.err span{color:var(--bad)}
.empty{padding:28px 18px;color:var(--mute)} .empty strong{color:var(--ink)}
#stage{overflow:auto;min-height:0;padding:16px 20px}
#stage h2{margin:0 0 2px;font-size:17px}
.meta{color:var(--mute);font-size:12px;font-family:var(--mono)}
.note{color:var(--mute);font-size:12px;margin:4px 0 0}
h3{font-size:12px;font-weight:600;color:var(--mute);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.bar label{display:inline-flex;gap:4px;align-items:center}
.bar select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.cv{overflow:auto;max-width:100%;max-height:70vh;border:1px solid var(--line);border-radius:6px;background:
  repeating-conic-gradient(#2a2f35 0 25%,#23272c 0 50%) 0 0/16px 16px;display:inline-block}
.cv canvas{display:block;image-rendering:pixelated;cursor:crosshair}
.side{padding:12px 14px;border-bottom:1px solid var(--line)}
.side h4{margin:0 0 6px;font-size:13px}
.side p{margin:4px 0;color:var(--mute);font-size:12px}
.side label{display:block;color:var(--mute);font-size:12px;margin:8px 0 3px}
.side .btn{margin-top:6px}
.pal{display:grid;grid-template-columns:28px repeat(16,1fr);gap:2px;align-items:center;margin:2px 0}
.pal b{font:11px var(--mono);color:var(--mute)}
.pal i{display:block;aspect-ratio:1;border:1px solid #0006;cursor:pointer;min-width:0}
.pal i.on{outline:2px solid var(--acc2);outline-offset:0;position:relative;z-index:1}
.pal i.t{background-image:linear-gradient(135deg,transparent 45%,#e07a6a 45% 55%,transparent 55%)}
.cur{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:8px}
.cur input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--line);background:none}
.msg{font-size:12px;margin-top:8px;white-space:pre-wrap}
.ok{color:var(--acc)} .bad{color:var(--bad)} .warn{color:var(--acc2)}
table.tx{border-collapse:collapse;width:100%;font-size:13px}
table.tx td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle}
table.tx td.a{font:11px var(--mono);color:var(--mute);white-space:nowrap}
table.tx input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-family:var(--mono);font-size:12px}
table.tx input.chg{border-color:var(--acc2)} table.tx input.mv{border-color:var(--bad)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .dh h3{margin:0;font-size:15px;flex:1;color:var(--ink);text-transform:none;letter-spacing:0}
dialog .db{overflow:auto;padding:10px 16px;max-height:60vh}
dialog .db li{margin:3px 0}
dialog .df{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
@media(max-width:1000px){main{grid-template-columns:200px 1fr}.col.r{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}main{grid-auto-rows:minmax(0,1fr) auto}}
</style>
</head>
<body>
<header>
  <div><h1>Interfaz y menús</h1><div class="sub">FoMT (GBA, USA) — pantallas de menú, objetos OAM, piezas del HUD y textos de menú leídos desde los punteros del código</div></div>
  <div style="flex:1"></div>
  <span id="romst">Sin ROM</span>
  <label class="btn" for="rom-in">Abrir ROM (.gba)</label>
  <input id="rom-in" type="file" accept=".gba" hidden>
  <button class="btn primary" id="genbtn" disabled>Generar ROM</button>
</header>
<main>
  <section class="col l" aria-label="Lista">
    <div class="tabs" role="tablist"><button class="on" data-tab="gfx">Gráficos</button><button data-tab="txt">Textos</button></div>
    <div id="list"><div class="empty"><strong>Abre la ROM</strong> (o cárgala en la suite) para ver los menús.</div></div>
  </section>
  <section id="stage" aria-label="Vista"><div class="empty">Elige un gráfico de la lista.</div></section>
  <section class="col r" id="side" aria-label="Acciones"></section>
</main>
<dialog id="gendlg">
  <div class="dh"><h3>Generar ROM</h3><button class="btn" id="genclose">Cerrar</button></div>
  <div class="db" id="genbody"></div>
  <div class="df" id="genfoot"></div>
</dialog>
<script src="fomt-hub.js"></script>
<script>
'use strict';
/* Códec «popuri» (cabecera 0x70) copiado tal cual de mapas.html; unpack.end guarda dónde acaba el bloque leído. */
function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }
// El flujo se lee en palabras de 32 bits little-endian, de bit alto a bajo (igual que el juego y que decompress.py).
function BitReader(d, o) {
  this.d = d;
  this.o = o;
  this.w = 0;
  this.n = 0;
}
BitReader.prototype.read = function (k) {
  var out = 0, take, d = this.d, o;
  while (k > 0) {
    if (this.n === 0) {
      o = this.o;
      this.w = o + 3 < d.length ? ((d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0) : 0;
      this.o = o + 4;
      this.n = 32;
    }
    take = Math.min(k, this.n);
    out = out * Math.pow(2, take) + ((this.w >>> (this.n - take)) & (take === 32 ? 0xFFFFFFFF : ((1 << take) - 1)));
    this.n -= take;
    k -= take;
  }
  return out;
};

function huffTree(br, bits) {
  var tree = [0xFFFFFFFF], path = 0, total = 0, nb, i, c, node, pb, sh, child, leaf;
  for (nb = 0; nb < bits * 2; nb++) {
    c = br.read(bits); total += c;
    if (total > (1 << bits)) return null;
    path = path << 1;
    for (i = 0; i < c; i++) {
      node = 0;
      for (pb = 0; pb < nb; pb++) {
        sh = ((path >> (nb - pb)) & 1) * 16;
        child = (tree[node] >>> sh) & 0xFFFF;
        if (child === 0xFFFF) {
          child = tree.length; tree.push(0xFFFFFFFF);
          tree[node] = ((tree[node] & ~(0xFFFF << sh)) | (child << sh)) >>> 0;
        }
        node = child;
      }
      sh = (path & 1) * 16;
      leaf = tree.length; tree.push((0x80000000 | br.read(bits)) >>> 0);
      tree[node] = ((tree[node] & ~(0xFFFF << sh)) | (leaf << sh)) >>> 0;
      path++;
    }
  }
  for (i = 0; i < tree.length; i++) if ((tree[i] & 0xFFFF0000) >>> 0 === 0xFFFF0000 || (tree[i] & 0xFFFF) === 0xFFFF) return null;
  return tree;
}

function huffDecode(br, tree) {
  var cur = 0;
  while ((tree[cur] >>> 31) === 0) cur = (tree[cur] >>> (br.read(1) * 16)) & 0xFFFF;
  return tree[cur] & 0x7FFFFFF;
}

function ladderOf(br, n) {
  var off = 1, out = [], bits;
  for (var i = 0; i < n; i++) { bits = br.read(4) + 1; out.push({ s: off, b: bits }); off += Math.pow(2, bits); }
  return out;
}
function dist(br, l) { return l.s + br.read(l.b); }
function vli(br, k) {
  var r = 0, a;
  for (;;) { a = br.read(k); r = (r << (k - 1)) + (a >> 1); if (!(a & 1)) return r; }
}
function lookup(data, d, len) { for (var i = 0; i < len; i++) data.push(data[data.length - d]); }

var LZSS = [
  function (br, rd, data, size) {
    var lad = ladderOf(br, 2), m, n, i, d, v;
    while (data.length < size) {
      m = br.read(2);
      if (m === 2) { n = 1 + br.read(6); for (i = 0; i < n; i++) data.push(rd()); }
      else if (m === 3) { n = 2 + br.read(6); v = br.read(8); for (i = 0; i < n; i++) data.push(v); }
      else { d = dist(br, lad[m]); n = 3 + br.read(6); if (d > data.length) return false; lookup(data, d, n); }
    }
    return true;
  },
  function (br, rd, data, size) {
    var lad = ladderOf(br, 4), d, n;
    while (data.length < size) {
      if (br.read(1) === 0) data.push(rd());
      else { d = dist(br, lad[br.read(2)]); n = 3 + br.read(4); if (d > data.length) return false; lookup(data, d, n); }
    }
    return true;
  },
  function (br, rd, data, size) {
    var lad = ladderOf(br, 7), idx, d, n, cnt, i;
    while (data.length < size) {
      if (br.read(1) === 0) { data.push(rd()); continue; }
      idx = br.read(3);
      if (idx < 7) { d = dist(br, lad[idx]); n = 3 + br.read(4); if (d > data.length) return false; lookup(data, d, n); }
      else {
        cnt = vli(br, 4);
        if (br.read(1) === 0) { for (i = 0; i < cnt + 1; i++) data.push(rd()); }
        else {
          idx = br.read(3); if (idx === 7) return false;
          d = dist(br, lad[idx]); n = br.read(4) + (cnt << 4) + 3;
          if (d > data.length) return false; lookup(data, d, n);
        }
      }
    }
    return true;
  },
  function (br, rd, data, size) {
    var lad = ladderOf(br, 3), idx, d, n, cnt, i;
    while (data.length < size) {
      if (br.read(1) === 0) { data.push(rd()); data.push(rd()); continue; }
      idx = br.read(2);
      if (idx < 3) { d = dist(br, lad[idx]); n = 2 + br.read(3); if (d * 2 > data.length) return false; lookup(data, d * 2, n * 2); }
      else {
        cnt = vli(br, 3);
        if (br.read(1) === 0) { for (i = 0; i < cnt + 1; i++) { data.push(rd()); data.push(rd()); } }
        else {
          idx = br.read(2); if (idx === 3) return false;
          d = dist(br, lad[idx]); n = br.read(3) + (cnt << 3) + 2;
          if (d * 2 > data.length) return false; lookup(data, d * 2, n * 2);
        }
      }
    }
    return true;
  },
  function (br, rd, data, size) { while (data.length < size) data.push(rd()); return true; }
];

var DIFF = [
  function () {},
  function (a) { var acc = 0, i, lo, hi; for (i = 0; i < a.length; i++) { lo = a[i] & 15; hi = (a[i] >> 4) & 15; acc = (hi + acc) & 15; hi = acc; acc = (lo + acc) & 15; lo = acc; a[i] = lo | (hi << 4); } },
  function (a) { var acc = 0, i; for (i = 0; i < a.length; i++) { acc = (a[i] + acc) & 255; a[i] = acc; } },
  function (a) { var acc = 0, i, v; for (i = 0; i + 1 < a.length; i += 2) { v = ((a[i] | (a[i + 1] << 8)) + acc) & 0xFFFF; acc = v; a[i] = v & 255; a[i + 1] = v >> 8; } },
  function (a) { var e = 0, o = 0, i; for (i = 0; i + 1 < a.length; i += 2) { e = (a[i] + e) & 255; o = (a[i + 1] + o) & 255; a[i] = e; a[i + 1] = o; } }
];

function unpack(rom, off) {
  off = off & 0x01FFFFFF;
  var head = u32(rom, off);
  if ((head & 255) !== 0x70 || (head >>> 8) > 0x40000) throw new Error('cabecera popuri no válida en 0x' + off.toString(16));
  var size = head >>> 8, br = new BitReader(rom, off + 4), fmt = br.read(8);
  var lz = fmt & 7, atom = (fmt >> 3) & 3, df = (fmt >> 5) & 7, rd, t4, t8;
  if (atom > 2 || lz > 4 || df > 4) throw new Error('formato de compresión no válido');
  if (atom === 0) rd = function () { return br.read(8); };
  else if (atom === 1) { t4 = huffTree(br, 4); if (!t4) throw new Error('árbol Huffman corrupto'); rd = function () { var hi = huffDecode(br, t4), lo = huffDecode(br, t4); return (hi << 4) | lo; }; }
  else { t8 = huffTree(br, 8); if (!t8) throw new Error('árbol Huffman corrupto'); rd = function () { return huffDecode(br, t8); }; }
  var data = [];
  if (!LZSS[lz](br, rd, data, size)) throw new Error('flujo LZSS corrupto');
  if (data.length > size) throw new Error('flujo LZSS desbordado');
  DIFF[df](data);
  unpack.end = br.o;
  return Uint8Array.from(data);
}

function BitW() { this.words = []; this.cur = 0; this.n = 0; }
BitW.prototype.put = function (v, k) {
  while (k > 0) {
    var take = Math.min(k, 32 - this.n), part = (v >>> (k - take)) & (take === 32 ? 0xFFFFFFFF : ((1 << take) - 1));
    this.cur = (this.cur | (part << (32 - this.n - take))) >>> 0; this.n += take; k -= take;
    if (this.n === 32) { this.words.push(this.cur); this.cur = 0; this.n = 0; }
  }
};

function packPopuri(src) {
  var n = src.length;
  if (n & 1) throw new Error('el bloque debe tener un número par de bytes');
  if (n > 0x3FFFF) throw new Error('bloque demasiado grande');
  var hn = n >> 1, H = new Uint16Array(hn), j, bw = new BitW();
  for (j = 0; j < hn; j++) H[j] = src[2 * j] | (src[2 * j + 1] << 8);
  var B = [6, 10, 14], S = [1, 1 + (1 << 6), 1 + (1 << 6) + (1 << 10)], MAXD = (1 << 6) + (1 << 10) + (1 << 14);
  var head = new Int32Array(65536).fill(-1), prev = new Int32Array(hn), i = 0;
  bw.put(0x03, 8); bw.put(B[0] - 1, 4); bw.put(B[1] - 1, 4); bw.put(B[2] - 1, 4);
  function hash(p) { return ((H[p] * 40503) ^ (H[p + 1] * 9973)) & 0xFFFF; }
  function ins(p) { if (p + 1 < hn) { var h = hash(p); prev[p] = head[h]; head[h] = p; } }
  while (i < hn) {
    var bl = 0, bd = 0, cand = i + 1 < hn ? head[hash(i)] : -1, depth = 0, maxl = Math.min(9, hn - i);
    while (cand >= 0 && depth++ < 256) {
      var d = i - cand; if (d > MAXD) break;
      var l = 0; while (l < maxl && H[cand + l] === H[i + l]) l++;
      if (l > bl) { bl = l; bd = d; if (l === maxl) break; }
      cand = prev[cand];
    }
    if (bl >= 2) {
      var idx = bd < S[1] ? 0 : bd < S[2] ? 1 : 2;
      bw.put(1, 1); bw.put(idx, 2); bw.put(bd - S[idx], B[idx]); bw.put(bl - 2, 3);
      for (j = 0; j < bl; j++) ins(i + j);
      i += bl;
    } else { bw.put(0, 1); bw.put(H[i] & 255, 8); bw.put(H[i] >> 8, 8); ins(i); i++; }
  }
  if (bw.n > 0) bw.words.push(bw.cur);
  bw.words.push(0);
  var out = new Uint8Array(4 + bw.words.length * 4), dv = new DataView(out.buffer);
  dv.setUint32(0, (0x70 | (n << 8)) >>> 0, true);
  bw.words.forEach(function (w, k) { dv.setUint32(4 + k * 4, w, true); });
  return out;
}

/* ================================================================ interfaz
   Todo se localiza por el literal del código que guarda el puntero (ref), nunca por una dirección fija:
   si otra herramienta (o esta misma) reubicó un bloque, se sigue leyendo bien. Verificado contra la ROM USA
   (SHA1 a2fc3574…) y el desensamblado de StanHash_fomt:
     Unpack(src, dst)             — bloque 0x70 → VRAM (tiles en 0x06000000, mapas en 0x0600E000–0x0600F800)
     func_08008E64(src, dst, n)   — copia sin comprimir (paletas a 0x05000000)
     func_08008F0C(obj, src, dst, n) — piezas sin comprimir del HUD
     func_0805E6CC(obj, banco)    — banco OAM de 7 secciones (mismo formato que sprites.html) */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const hex = (n, w = 3) => "0x" + n.toString(16).toUpperCase().padStart(w, "0");
const ROM_BASE = 0x08000000;
const rd16 = (b, o) => b[o] | (b[o + 1] << 8);
const rd32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
const wr16 = (b, o, v) => { b[o] = v & 255; b[o + 1] = (v >> 8) & 255; };
const wr32 = (b, o, v) => { wr16(b, o, v & 0xFFFF); wr16(b, o + 2, v >>> 16); };
const rgbOf = c => [Math.floor((c & 31) * 255 / 31), Math.floor(((c >> 5) & 31) * 255 / 31), Math.floor(((c >> 10) & 31) * 255 / 31)];
const bgrOf = (r, g, b) => (Math.round(r * 31 / 255)) | (Math.round(g * 31 / 255) << 5) | (Math.round(b * 31 / 255) << 10);
const SEC = [4, 16, 8, 32, 32, 8, 4];
const OBJ_SZ = {"0,0":[8,8],"0,1":[16,16],"0,2":[32,32],"0,3":[64,64],"1,0":[16,8],"1,1":[32,8],"1,2":[32,16],"1,3":[64,32],"2,0":[8,16],"2,1":[8,32],"2,2":[16,32],"2,3":[32,64]};
const GUARD = [0x46, 0x4D, 0x55, 0x49];   // "FMUI" tras lo escrito: que nadie tome nuestros ceros finales por espacio libre

/* Pantallas: tiles y mapas comprimidos (0x70), paleta sin comprimir {ref, tamaño, destino dentro de la paleta BG}.
   Los mapas van de atrás adelante; «alt» = son escenas alternativas (se ve una cada vez). */
const SCREENS = [
  {id: "titulo", cat: "Pantallas", name: "Pantalla de título", fn: "func_080019D8",
   note: "4 capas BG de 32×64 tiles (la cámara baja del cielo al grupo de personajes). Los textos «start/continue» son OAM: ver «Título: start / continue».",
   tiles: 0x1DC4, pal: {ref: 0x1DC8, size: 0x200, dst: 0}, maps: [0xE8684, 0xE8688, 0xE868C, 0xE8690]},
  {id: "calendario", cat: "Pantallas", name: "Calendario", fn: "func_080A2BA4",
   note: "Papel de fondo, casillas por día de la semana y rejilla (BG en 0x0600E000, 0x0600E800, 0x0600F000).",
   tiles: 0xA2FDC, pal: {ref: 0xA2FE0, size: 0x200, dst: 0}, maps: [0xA2FD0, 0xA2FD4, 0xA2FD8]},
  {id: "logo", cat: "Pantallas", name: "Logo de Natsume", fn: "func_08000F5C · func_08077810",
   note: "Intro. Los mismos tiles los carga también func_08077810 (en 0x06008000).",

/* Un «gráfico» para el editor: tiles (vista de bytes 4bpp), paleta y cómo se ve. */
function buildAsset(def){

      A.rows = []; for (let r = A.palDst >> 5; r < (A.palDst + A.pb.data.length) >> 5; r++) A.rows.push(r);
    } else if (def.tiles) {                    // pieza suelta

      A.tiles = () => A.tb.data; A.palBytes = () => A.pb.data; A.rows = [0];

  ASSETS = [...SCREENS, ...BANKS, ...PIECES].map(buildAsset);

    for (const o of t.refs) { const p = rd32(rom, o) - ROM_BASE; let q = p; while (rom[q]) q++; if (!eq(rom.slice(p, q), t.cur)) { bad.push(`Texto ${hex(t.off + ROM_BASE, 8)}: el literal ${hex(o, 5)} no relee «${decodeTxt(t.cur)}»`); break; } }
    delete t.at;
  }
  for (let i = 0xA0; i < 0xC0; i++) if (rom[i] !== ORIG[i]) { bad.push("La cabecera de la ROM cambió"); break; }
  if (!bad.length) out.push(`Releídos ${placed.length} bloque(s) desde sus literales: idénticos a lo editado.`);
  return {rom, out, bad};
}
$("genbtn").onclick = () => {
  const dl = $("gendlg"), body = $("genbody"), foot = $("genfoot");
  let r; try { r = build(); } catch (e) { r = {rom: null, out: [], bad: [e.message]}; }
  const {rom, out, bad} = r;
  body.innerHTML = `<p>${out.length ? "Cambios:" : "Sin cambios: la ROM saldrá igual."}</p><ul>${out.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    ${bad.length ? `<ul>${bad.map(x => `<li class="bad">${esc(x)}</li>`).join("")}</ul><p class="bad">✗ La verificación falló: no se descarga.</p>`
      : `<p class="ok">✓ Verificación correcta. ROM de ${(rom.length / 1048576).toFixed(rom.length % 1048576 ? 2 : 0)} MB${rom.length > ORIG.length ? " (ampliada)" : ""}.</p>`}`;
  foot.innerHTML = "";
  if (!bad.length) {
    const name = ROMNAME.replace(/\.gba$/i, "").replace(/ \(interfaz\)$/, "") + " (interfaz).gba";
    const b = document.createElement("button"); b.className = "btn primary"; b.textContent = "Descargar ROM (.gba)";
    b.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rom])); a.download = name; a.click(); };
    foot.appendChild(b);
    if (FomtHub.inSuite) { FomtHub.publish(rom, name); const s = document.createElement("span"); s.className = "ok"; s.style.alignSelf = "center"; s.textContent = "Enviada a la suite como ROM de trabajo."; foot.prepend(s); }
    loadRom(rom, name);   // seguir editando sobre la ROM generada (releída desde cero)
  }
  dl.showModal();
};
$("genclose").onclick = () => $("gendlg").close();
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  TAB = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  SEL = TAB === "txt" ? (TEXTS.length ? "txt:" + TEXTS[0].g : null) : (ASSETS.find(a => !a.err) || {def: {}}).def.id;
  renderList(); renderStage(); renderSide();
});
$("rom-in").onchange = async e => { const f = e.target.files[0]; if (f) loadRom(await f.arrayBuffer(), f.name); e.target.value = ""; };
FomtHub.onRom((b, name) => loadRom(b, name));
</script>
